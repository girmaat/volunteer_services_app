<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThankYou UAT Tracker</title>
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #e3e1da; --line-strong: #c9c6bc;
    --primary: #0f6b5c; --primary-ink: #ffffff; --primary-tint: #e3f1ee;
    --pass: #1d7a3e; --pass-tint: #e2f4e8; --fail: #b3261e; --fail-tint: #fbe4e2; --blocked: #8a5a00; --blocked-tint: #fdf0d5;
    --focus: 0 0 0 3px #ffd54d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --surface: #1c2028; --ink: #e8eaf0; --muted: #a2a9b6; --line: #2c313b; --line-strong: #3d4350;
      --primary: #4fc1aa; --primary-ink: #0b1714; --primary-tint: #1d322e;
      --pass: #6fd18f; --pass-tint: #1b3124; --fail: #ff8a80; --fail-tint: #3a1f1d; --blocked: #f2c46b; --blocked-tint: #3a2f17;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
  a { color: var(--primary); }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; }
  .progress { flex: 1 1 220px; min-width: 180px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .progress small { color: var(--muted); }
  .btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid var(--line); background: var(--surface); padding: 12px; overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 60px; }
  nav .file { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  nav .file:hover, nav .file.active { background: var(--primary-tint); }
  nav .file .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
  nav ol { list-style: none; margin: 2px 0 8px; padding: 0 0 0 8px; }
  nav ol button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
  nav ol button.current { background: var(--bg); color: var(--ink); font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--line-strong); transform: translateY(1px); }
  .dot.pass { background: var(--pass); border-color: var(--pass); } .dot.fail { background: var(--fail); border-color: var(--fail); } .dot.blocked { background: var(--blocked); border-color: var(--blocked); }
  main { padding: 24px clamp(16px, 3vw, 40px) 80px; max-width: 980px; }
  .crumbs { color: var(--muted); font-size: 13.5px; margin-bottom: 6px; }
  .case h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .pill { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
  .pill.P1 { background: var(--fail-tint); border-color: transparent; color: var(--fail); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; }
  .card ul, .card ol { padding-left: 22px; margin: 6px 0; } .card li { margin: 3px 0; } .card p { margin: 8px 0; }
  .card > ul > li { margin: 8px 0; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  code.copy { cursor: copy; } code.copy:hover { border-color: var(--primary); }
  a.url code { cursor: pointer; color: var(--primary); }
  blockquote { margin: 10px 0; padding: 4px 14px; border-left: 4px solid var(--primary); background: var(--primary-tint); border-radius: 0 8px 8px 0; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .tablewrap { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .result { margin-top: 18px; }
  .result h3 { margin: 0 0 10px; font-size: 16px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .choice { border: 2px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
  .choice.pass[aria-pressed=true] { background: var(--pass-tint); border-color: var(--pass); color: var(--pass); }
  .choice.fail[aria-pressed=true] { background: var(--fail-tint); border-color: var(--fail); color: var(--fail); }
  .choice.blocked[aria-pressed=true] { background: var(--blocked-tint); border-color: var(--blocked); color: var(--blocked); }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; background: var(--surface); }
  .saved { color: var(--muted); font-size: 13px; min-height: 20px; }
  .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .intro { color: var(--muted); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .menu { position: relative; } .menu summary { list-style: none; } .menu summary::-webkit-details-marker { display: none; }
  .menu-pop { position: absolute; right: 0; top: 40px; display: grid; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 10; }
  .who { display: flex; align-items: center; gap: 6px; } .who input { border: 1px solid var(--line-strong); border-radius: 8px; padding: 5px 8px; width: 170px; background: var(--surface); }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } nav { position: static; max-height: 260px; border-right: 0; border-bottom: 1px solid var(--line); } }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>ThankYou UAT Tracker</h1>
  <label class="who">Tester <input id="tester" placeholder="Your name" autocomplete="name"></label>
  <div class="progress" aria-live="polite">
    <div class="bar" aria-hidden="true"><span id="b-pass" style="background:var(--pass)"></span><span id="b-fail" style="background:var(--fail)"></span><span id="b-blocked" style="background:var(--blocked)"></span></div>
    <small id="summary"></small>
  </div>
  <button class="btn" id="guide-btn">How to test</button>
  <button class="btn" id="next-open">Next not tested</button>
  <button class="btn primary" id="export">Export results (CSV)</button>
  <details class="menu"><summary class="btn">More…</summary>
    <div class="menu-pop">
      <button class="btn" id="backup">Save a backup of my results</button>
      <button class="btn" id="restore">Load results from a backup</button>
      <button class="btn" id="clear">Clear all results</button>
    </div>
  </details>
</header>
<div class="layout">
  <nav id="nav" aria-label="Test files"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script>
const DATA = /*__DATA__*/null;
const KEY = "thankyou-uat-results-v1";
let state = { tester: "", results: {}, current: null };
try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const all = [];
DATA.files.forEach((f, fi) => f.cases.forEach((c, ci) => all.push({ ...c, fi, ci, file: f })));
const byId = Object.fromEntries(all.map((c, i) => [c.id, i]));
let showGuide = false;
let openFile = null;

const $ = (id) => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
const statusOf = (id) => (state.results[id] || {}).status || "";

function summary() {
  const n = { pass: 0, fail: 0, blocked: 0 };
  all.forEach((c) => { const s = statusOf(c.id); if (n[s] !== undefined) n[s]++; });
  const done = n.pass + n.fail + n.blocked;
  ["pass", "fail", "blocked"].forEach((k) => ($("b-" + k).style.width = (100 * n[k] / all.length) + "%"));
  $("summary").textContent = `${done} of ${all.length} tested · ${n.pass} passed · ${n.fail} failed · ${n.blocked} blocked`;
}

function renderNav() {
  const cur = all[byId[state.current]];
  const nav = $("nav");
  nav.innerHTML = "";
  DATA.files.forEach((f, fi) => {
    const tested = f.cases.filter((c) => statusOf(c.id)).length;
    const b = document.createElement("button");
    b.className = "file" + (cur && cur.fi === fi ? " active" : "");
    b.innerHTML = `<span>${f.file.slice(0, 2)} · ${f.title}</span><span class="count">${tested}/${f.cases.length}</span>`;
    b.onclick = () => { openFile = openFile === fi ? null : fi; if (!cur || cur.fi !== fi) go(f.cases[0].id); else renderNav(); };
    nav.appendChild(b);
    if ((cur && cur.fi === fi) || openFile === fi) {
      const ol = document.createElement("ol");
      f.cases.forEach((c) => {
        const li = document.createElement("li");
        const cb = document.createElement("button");
        cb.className = c.id === state.current ? "current" : "";
        cb.innerHTML = `<span class="dot ${statusOf(c.id)}"></span><span>${c.id.replace("TC-", "")} ${c.title}</span>`;
        cb.onclick = () => go(c.id);
        li.appendChild(cb); ol.appendChild(li);
      });
      nav.appendChild(ol);
    }
  });
}

function renderCase() {
  const main = $("main");
  if (showGuide) {
    main.innerHTML = `<div class="card">${DATA.guide}</div><div class="nav-row"><span></span><button class="btn primary" id="close-guide">Start testing</button></div>`;
    $("close-guide").onclick = () => { showGuide = false; renderCase(); };
    wire(main);
    return;
  }
  const i = byId[state.current] ?? 0;
  const c = all[i];
  state.current = c.id; save();
  const r = state.results[c.id] || {};
  const first = c.ci === 0;
  main.innerHTML = `
    <div class="crumbs">${c.file.file.slice(0, 2)} · ${c.file.title} — case ${c.ci + 1} of ${c.file.cases.length}</div>
    ${first ? `<details class="intro"><summary>About this area</summary>${c.file.intro}</details>` : ""}
    <article class="case">
      <h2>${c.title}</h2>
      <div class="meta"><span class="pill">${c.id}</span>${c.priority ? `<span class="pill ${c.priority}">${c.priority}${c.priority === "P1" ? " · must work" : c.priority === "P2" ? " · important" : " · nice to have"}</span>` : ""}
        ${c.url ? `<a class="btn" href="${c.url}" target="_blank" rel="noopener">Open the page ↗</a>` : ""}</div>
      <div class="card">${c.html}</div>
      <section class="result card" aria-labelledby="rh">
        <h3 id="rh">Result</h3>
        <div class="choices" role="group" aria-label="Result">
          <button class="choice pass" data-s="pass" aria-pressed="${r.status === "pass"}">✓ Pass</button>
          <button class="choice fail" data-s="fail" aria-pressed="${r.status === "fail"}">✕ Fail</button>
          <button class="choice blocked" data-s="blocked" aria-pressed="${r.status === "blocked"}">⏸ Blocked</button>
          ${r.status ? `<button class="btn" data-s="">Clear</button>` : ""}
        </div>
        <label for="notes"><strong>Notes</strong> <span class="intro">— what you saw, steps that failed, screenshot file names</span></label>
        <textarea id="notes" placeholder="Required for Fail or Blocked">${r.notes ? r.notes.replace(/</g, "&lt;") : ""}</textarea>
        <div class="saved" id="saved">${r.at ? "Saved " + new Date(r.at).toLocaleString() : ""}</div>
      </section>
      <div class="nav-row">
        <button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn primary" id="next" ${i === all.length - 1 ? "disabled" : ""}>Next →</button>
      </div>
    </article>`;
  main.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => setStatus(c.id, b.dataset.s)));
  $("notes").oninput = (e) => { const cur = state.results[c.id] || {}; state.results[c.id] = { ...cur, notes: e.target.value, at: Date.now() }; save(); $("saved").textContent = "Saved " + new Date().toLocaleString(); };
  $("prev").onclick = () => go(all[i - 1].id);
  $("next").onclick = () => go(all[i + 1].id);
  wire(main);
  main.focus?.();
}

function wire(root) {
  root.querySelectorAll("code.copy").forEach((el) => (el.onclick = () => copy(el.textContent)));
  root.querySelectorAll("a[data-file]").forEach((a) => (a.onclick = (e) => { e.preventDefault(); const f = DATA.files.find((x) => x.file === a.dataset.file); if (f) { showGuide = false; go(f.cases[0].id); } else { showGuide = true; renderCase(); } }));
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  toast(`Copied: ${text}`);
}

function setStatus(id, s) {
  const cur = state.results[id] || {};
  if ((s === "fail" || s === "blocked") && !(cur.notes || "").trim()) { $("notes").focus(); toast("Add a note saying what went wrong"); }
  state.results[id] = { ...cur, status: s, at: Date.now() };
  if (!s) delete state.results[id].status;
  save(); summary(); renderNav(); renderCase();
}

function go(id) { showGuide = false; state.current = id; save(); renderNav(); renderCase(); window.scrollTo(0, 0); }

function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function exportCsv() {
  const rows = [["Case ID", "Title", "Area", "Priority", "Result", "Notes", "Tested at", "Tester"]];
  all.forEach((c) => { const r = state.results[c.id] || {}; rows.push([c.id, c.title, c.file.title, c.priority, r.status ? r.status[0].toUpperCase() + r.status.slice(1) : "Not tested", r.notes || "", r.at ? new Date(r.at).toLocaleString() : "", state.tester]); });
  const blob = new Blob(["﻿" + rows.map((r) => r.map(csvCell).join(",")).join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ThankYou-UAT-results-${(state.tester || "tester").replace(/\W+/g, "-")}-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  toast("Results downloaded");
}

$("tester").value = state.tester || "";
$("tester").oninput = (e) => { state.tester = e.target.value; save(); };
$("export").onclick = exportCsv;
$("guide-btn").onclick = () => { showGuide = true; renderCase(); window.scrollTo(0, 0); };
$("next-open").onclick = () => {
  const start = (byId[state.current] ?? -1) + 1;
  const order = all.slice(start).concat(all.slice(0, start));
  const n = order.find((c) => !statusOf(c.id));
  if (n) go(n.id); else toast("Every case has a result");
};
const closeMenu = () => document.querySelector(".menu").removeAttribute("open");
$("backup").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  a.download = `ThankYou-UAT-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); closeMenu();
};
$("restore").onclick = () => { closeMenu(); $("import-file").click(); };
$("clear").onclick = () => { closeMenu(); if (confirm("Clear every result and note? This can't be undone.")) { state.results = {}; save(); summary(); renderNav(); renderCase(); } };
$("import-file").onchange = async (e) => {
  try { const s = JSON.parse(await e.target.files[0].text()); if (s && s.results) { state = Object.assign(state, s); save(); summary(); renderNav(); renderCase(); toast("Results loaded"); } }
  catch { toast("That file isn't a results backup"); }
};
document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea, input")) return;
  const i = byId[state.current] ?? 0;
  if (e.key === "ArrowRight" && i < all.length - 1) go(all[i + 1].id);
  if (e.key === "ArrowLeft" && i > 0) go(all[i - 1].id);
});

if (!state.current || byId[state.current] === undefined) { state.current = all[0].id; showGuide = true; }
summary(); renderNav(); renderCase();
</script>
</body>
</html>

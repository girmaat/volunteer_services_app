version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: thankyou
      POSTGRES_PASSWORD: thankyou
      POSTGRES_DB: thankyou
    ports:
      - "5432:5432"
    volumes:
      - thankyou_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

volumes:
  thankyou_pgdata:

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thankyou_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thankyou_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/thankyou_test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4202
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:api-calls
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

  # The UAT scripts (U1–U15) and the accessibility sweep, against a production build.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thankyou_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thankyou_e2e
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/thankyou_e2e
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4202
      API_BASE_URL: http://localhost:4202
      WEB_BASE_URL: http://localhost:3202
      CORS_ORIGIN: http://localhost:3202
      DEV_EMAIL_LINKS: "true"
      EMAIL_TRANSPORT: log
      GEOCODING_DISABLED: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: "60"
      INTERNAL_API_KEY: ci-internal-key-0123456789abcdef
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - name: Start API and web
        run: |
          pnpm --filter @thankyou/api start > api.log 2>&1 &
          pnpm --filter @thankyou/web start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4202/v1/public/categories > /dev/null && curl -sf http://localhost:3202/ > /dev/null && break; sleep 2; done
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            e2e-results/
            api.log
            web.log
